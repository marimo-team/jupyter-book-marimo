# See docs at: https://mystmd.org/guide/frontmatter
version: 1

project:
  id: e26b9be9-1ef3-4e13-b184-659841b4701c
  title: jupyter-book-marimo
  description: Python, SQL, and Markdown cells share one marimo app across each page.
  thumbnail: ./assets/brand/jupyter-book-marimo-og.png
  github: https://github.com/marimo-team/jupyter-book-marimo
  keywords:
    - marimo
    - Jupyter Book
    - MyST
    - reactive notebooks
  exclude:
    # Generated serving copy for the anywidget bridge.
    - .jupyter-book-marimo/**
    - _build/**
    - _site/**
  static_files:
    - assets
  plugins:
    - type: executable
      path: ../.venv/bin/jupyter-book-marimo
  toc:
    - file: index.md
      title: Overview
    - file: api/install.md
      title: Getting started
    - file: api/index.md
      title: Reference
      children:
        - file: api/authoring.md
        - file: api/configuration.md
        - file: api/styling.md
        - file: api/runtime-assets.md
    - file: tutorials/index.md
      title: Tutorials
      children:
        - file: tutorials/intro.md
        - file: tutorials/dataflow.md
        - file: tutorials/ui.md
        - file: tutorials/markdown.md
        - file: tutorials/plots.md
        - file: tutorials/layout.md
        - file: tutorials/fileformat.md
        - file: tutorials/sql.md
        - file: tutorials/markdown_format.md
          title: Markdown file format
        - file: tutorials/for_jupyter_users.md

site:
  template: book-theme
  title: jupyter-book-marimo
  options:
    folders: true
    favicon: assets/brand/jupyter-book-marimo-favicon.ico
    logo: assets/brand/jupyter-book-marimo-mark-light.svg
    logo_dark: assets/brand/jupyter-book-marimo-mark-dark.svg
    logo_alt: jupyter-book-marimo
    logo_text: jupyter-book-marimo
    style: styles/site.css
  nav: []
  actions: []
  domains: []
