[project]
name = "jupyter-book-marimo"
version = "0.0.2"
description = "Render marimo cells as hydrated islands in Jupyter Book."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["jupyter-book", "marimo", "myst", "notebooks", "widgets"]
authors = [
    { name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "marimo>=0.23.16",
    "uv",
]

[dependency-groups]
dev = [
    "deno>=2.8",
    "hatchling>=1.27",
    "jupyter-book>=2.1",
    "pytest>=9",
    "ruff>=0.16",
    "ty>=0.0.39",
]

[project.urls]
Documentation = "https://marimo-team.github.io/jupyter-book-marimo/"
Repository = "https://github.com/marimo-team/jupyter-book-marimo"
Issues = "https://github.com/marimo-team/jupyter-book-marimo/issues"

[project.scripts]
jupyter-book-marimo = "jupyter_book_marimo.__main__:main"

[build-system]
requires = [
    "deno>=2.8",
    "hatchling>=1.27",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jupyter_book_marimo"]
artifacts = [
    "src/jupyter_book_marimo/assets/container-widget.mjs",
    "src/jupyter_book_marimo/assets/islands-bridge.css",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/hatch_build.py"

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { marimo = false }

[tool.ruff.lint.per-file-ignores]
"src/jupyter_book_marimo/compiler.py" = ["SIM102"]
