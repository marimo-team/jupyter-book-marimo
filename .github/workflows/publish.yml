name: Publish package

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    runs-on: "${{ vars.CI_RUNNER_SMALL || 'ubuntu-latest' }}"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          version: "0.12.23"
      - name: Read coordinated release version
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/release-metadata.py > "$RUNNER_TEMP/release-manifest.json"
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: marimo-team/internal-gh-actions/validate-release@3a52681ab8e200a34175ec8e5d14985e4e7ce3c3
        with:
          manifest: ${{ runner.temp }}/release-manifest.json

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install "$(cat .python-version)"

      - name: Run release checks
        run: make check

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: "${{ vars.CI_RUNNER_SMALL || 'ubuntu-latest' }}"
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Publish package
        run: uv publish --trusted-publishing always

  release-notes:
    needs: publish
    runs-on: "${{ vars.CI_RUNNER_SMALL || 'ubuntu-latest' }}"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Update release notes
        run: npx changelogithub@14.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
